# What this does, in plain language:
# Several times a day (weighted to US game hours) it asks The Odds API for the current
# college basketball point spreads and saves one raw, time-stamped copy. Opening-line
# history cannot be recreated later, so it has to be captured as it happens.
#
# The raw odds go to the PRIVATE data repo (ohektner/shac-sb-index-data), because the
# provider's terms do not allow republishing them. This public repo only gets a status
# row per run (counts, credits left, file hash), never any odds.
#
# Safety notes:
# - Tokens are not left on disk (persist-credentials: false). Only the two push steps
#   get a token, and only for the moment they need it.
# - Actions are pinned to exact commits so a changed tag can't swap the code we run.
name: odds-snapshot

on:
  schedule:
    # 7 runs a day (2 credits each: US books + Pinnacle), about 434 of the free 500 a month.
    # Times are UTC. Arizona (UTC-7, no daylight saving): 6:17a, 9:17a, 12:17p, 2:17p,
    # 4:17p, 6:17p, 8:17p. Odd minutes avoid the top-of-hour rush when GitHub delays
    # or drops scheduled runs.
    - cron: "17 13,16,19,21,23 * * *"
    - cron: "17 1,3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read  # the guard lists this workflow's recent runs

concurrency:
  group: odds-snapshot
  cancel-in-progress: false

env:
  LOG: data/status/odds_snapshot_log.csv

jobs:
  # GitHub sometimes runs a scheduled job very late or not at all, so Owen's PC starts it
  # by hand when a slot is missed (scripts/schedule-backup.ps1). If GitHub's late run then
  # turns up for a slot that's already covered, this skips it so the slot isn't paid twice.
  # It fails open: if the check itself breaks, the snapshot still runs.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check out this repo
        if: github.event_name == 'schedule'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Skip if this slot already has a run
        id: check
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: src
        run: >
          python3 -m shac.snapshots.backup_trigger --repo . --guard odds-snapshot.yml
          --run-id "$GITHUB_RUN_ID" | tee -a "$GITHUB_OUTPUT"

  snapshot:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always the latest main, even when an old run is re-run, so the status log is current.
      - name: Check out this repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Check out the private data repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ohektner/shac-sb-index-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Take odds snapshot
        id: snapshot
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: >
          uv run --no-sync python -m shac.snapshots.odds
          --data-dir data-repo
          --log "$LOG"

      - name: Push raw snapshot to the private data repo
        id: push_data
        if: always()
        continue-on-error: true
        working-directory: data-repo
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ ! -d odds ]; then
            echo "No snapshot files to push."
            exit 0
          fi
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          auth_git() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds
          if git diff --cached --quiet; then
            echo "Nothing new to push to the data repo."
            exit 0
          fi
          git commit -q -m "odds snapshot $(date -u +%Y%m%dT%H%M%SZ)"
          for attempt in 1 2 3 4 5; do
            if auth_git push -q origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
            auth_git pull -q --rebase origin main || true
          done
          echo "Push to the data repo failed after 5 tries."
          exit 1

      # If the file never reached the data repo, the public record must say so.
      - name: Record a failed push in the status log
        if: always() && steps.push_data.outcome == 'failure'
        run: echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),push_failed,,,,,,,," >> "$LOG"

      - name: Commit status log to this repo (main)
        id: push_status
        if: always()
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$LOG" ]; then
            echo "No status log to commit."
            exit 0
          fi
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          auth_git() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pull out just the rows this run added, so they can be re-applied on top of
          # whatever main looks like now (no merge conflicts, no lost rows).
          git add -N "$LOG"
          NEW_ROWS=$(git diff --unified=0 -- "$LOG" | grep '^+' | grep -v '^+++' | cut -c2- || true)
          if [ -z "$NEW_ROWS" ]; then
            echo "No new status rows."
            exit 0
          fi
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          for attempt in 1 2 3 4 5; do
            auth_git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            mkdir -p "$(dirname "$LOG")"
            if [ -s "$LOG" ]; then
              printf '%s\n' "$NEW_ROWS" | grep -v '^fetched_at_utc,' >> "$LOG" || true
            else
              printf '%s\n' "$NEW_ROWS" > "$LOG"
            fi
            git add "$LOG"
            git commit -q -m "status: odds snapshot $STAMP"
            if auth_git push -q origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Push of the status log failed after 5 tries."
          exit 1

      - name: Fail the run if any step above failed
        if: >
          always() && (steps.snapshot.outcome == 'failure'
          || steps.push_data.outcome == 'failure'
          || steps.push_status.outcome == 'failure')
        run: |
          echo "snapshot: ${{ steps.snapshot.outcome }}, data push: ${{ steps.push_data.outcome }}, status push: ${{ steps.push_status.outcome }}"
          exit 1
