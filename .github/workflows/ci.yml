# Runs lint and tests on every pull request and on code pushed to main.
# Status-log and data commits made by the scheduled jobs don't trigger it.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "ledger/**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q
