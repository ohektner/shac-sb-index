# What this does, in plain language:
# Reads the live season's record from Databricks and commits site/season.json (derived
# numbers only) to main, where the /shac/ page on ohektner.github.io reads it. Runs twice a
# day; if GitHub runs it late or skips it, the page just shows an older "updated through"
# date. Plan: docs/DATABRICKS.md, D3.
name: season-export

on:
  schedule:
    - cron: "40 21 * * *"
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: season-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false
      - uses: databricks/setup-cli@12452ad4003a2dd61d5a7cee30bc068f750a2e00 # v1.27.0
      - name: Build season.json
        run: python3 databricks/scripts/export_season.py --out site/season.json
      - name: Commit it to main if it changed
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ ! -f site/season.json ]; then exit 0; fi
          git add -N site/season.json
          # Only generated_at changed? Then nothing new to publish.
          if [ -z "$(git diff -- site/season.json | grep '^[+-] ' | grep -v generated_at)" ]; then
            echo "No change."
            exit 0
          fi
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          auth_git() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp site/season.json "$RUNNER_TEMP/season.json"
          for attempt in 1 2 3 4 5; do
            auth_git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            mkdir -p site
            cp "$RUNNER_TEMP/season.json" site/season.json
            git add site/season.json
            git commit -q -m "site: season.json $(date -u +%Y%m%dT%H%M%SZ)" || exit 0
            if auth_git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "Push failed after 5 tries."
          exit 1
