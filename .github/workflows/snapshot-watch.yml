# What this does, in plain language:
# Twice a day, during the hours when the odds snapshot runs hourly, it reads the public
# status log and fails if the last good snapshot is more than 3 hours old. GitHub can
# skip scheduled runs silently, so this is the alarm. A failed run sends an email.
name: snapshot-watch

on:
  schedule:
    - cron: "47 23 * * *"
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: >
          uv run --no-sync python -m shac.snapshots.watch
          --log data/status/odds_snapshot_log.csv
          --max-age-hours 3
