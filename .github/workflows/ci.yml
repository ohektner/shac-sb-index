# Runs lint and tests on every pull request and on code pushed to main.
# Status-log and data commits made by the scheduled jobs don't trigger it.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "ledger/**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      # The ledger append-only test compares with main, so fetch it (checkout only
      # brings the PR's own commit).
      - run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - run: uv run --no-sync pytest -q
