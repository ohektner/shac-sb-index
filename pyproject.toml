[project]
name = "shac-sb-index"
version = "0.1.0"
description = "Shac SB Index: a college basketball forecasting model."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.27",
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shac"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
