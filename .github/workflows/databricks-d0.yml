name: databricks-d0

# D0 exit check (docs/DATABRICKS.md): deploy the bundle, upload a test file to the
# landing volume, and run the check job. Manual only; replaced by databricks-sync in D3.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks
  cancel-in-progress: false

jobs:
  d0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    defaults:
      run:
        working-directory: databricks
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: databricks/setup-cli@12452ad4003a2dd61d5a7cee30bc068f750a2e00 # v1.27.0
      - run: databricks bundle validate -t prod
      - run: databricks bundle deploy -t prod
      - name: Upload the test file
        run: |
          printf 'source,uploaded_at\ngithub-actions,%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > hello.csv
          databricks fs mkdir dbfs:/Volumes/workspace/shac/landing/d0
          databricks fs cp --overwrite hello.csv dbfs:/Volumes/workspace/shac/landing/d0/hello.csv
      - run: databricks bundle run -t prod d0_check
