# What this does, in plain language:
# Once a day it reads the men's basketball news feed on each athletics site (most are
# SIDEARM sites) for the D-I teams with a game in the next 36 hours: one request per site,
# 10+ seconds apart. The feeds were found, and robots.txt checked, by shac.news.team_sites
# (data/team_sites.csv). Headlines and summaries go to the PRIVATE data repo; this public
# repo only gets a status row per run (counts and a file hash).
# Owen chose these sites as the slow secondary news source on 2026-11-11 (docs/DECISIONS.md).
#
# Safety notes:
# - Tokens are not left on disk (persist-credentials: false). Only the two push steps
#   get a token, and only for the moment they need it.
# - Actions are pinned to exact commits so a changed tag can't swap the code we run.
name: news-sidearm

on:
  schedule:
    # 20:13 UTC = 1:13 p.m. Arizona, before the evening tips. Once a day: these sites are
    # the slow secondary source.
    - cron: "13 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-sidearm
  cancel-in-progress: false

env:
  LOG: data/status/news_sidearm_log.csv

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Always the latest main, even when an old run is re-run, so the status log is current.
      - name: Check out this repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false

      - name: Check out the private data repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ohektner/shac-sb-index-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Read team-site news feeds
        id: snapshot
        continue-on-error: true
        run: >
          uv run --no-sync python -m shac.news.sidearm
          --data-dir data-repo
          --log "$LOG"

      - name: Push raw snapshot to the private data repo
        id: push_data
        if: always()
        continue-on-error: true
        working-directory: data-repo
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ ! -d news ]; then
            echo "No snapshot files to push."
            exit 0
          fi
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          auth_git() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          if git diff --cached --quiet; then
            echo "Nothing new to push to the data repo."
            exit 0
          fi
          git commit -q -m "news sidearm $(date -u +%Y%m%dT%H%M%SZ)"
          for attempt in 1 2 3 4 5; do
            if auth_git push -q origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
            auth_git pull -q --rebase origin main || true
          done
          echo "Push to the data repo failed after 5 tries."
          exit 1

      # If the file never reached the data repo, the public record must say so.
      - name: Record a failed push in the status log
        if: always() && steps.push_data.outcome == 'failure'
        run: echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),push_failed,,,,,,,," >> "$LOG"

      - name: Commit status log to this repo (main)
        id: push_status
        if: always()
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$LOG" ]; then
            echo "No status log to commit."
            exit 0
          fi
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          auth_git() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pull out just the rows this run added, so they can be re-applied on top of
          # whatever main looks like now (no merge conflicts, no lost rows).
          git add -N "$LOG"
          NEW_ROWS=$(git diff --unified=0 -- "$LOG" | grep '^+' | grep -v '^+++' | cut -c2- || true)
          if [ -z "$NEW_ROWS" ]; then
            echo "No new status rows."
            exit 0
          fi
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          for attempt in 1 2 3 4 5; do
            auth_git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            mkdir -p "$(dirname "$LOG")"
            if [ -s "$LOG" ]; then
              printf '%s\n' "$NEW_ROWS" | grep -v '^fetched_at_utc,' >> "$LOG" || true
            else
              printf '%s\n' "$NEW_ROWS" > "$LOG"
            fi
            git add "$LOG"
            git commit -q -m "status: news sidearm $STAMP"
            if auth_git push -q origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Push of the status log failed after 5 tries."
          exit 1

      - name: Fail the run if any step above failed
        if: >
          always() && (steps.snapshot.outcome == 'failure'
          || steps.push_data.outcome == 'failure'
          || steps.push_status.outcome == 'failure')
        run: |
          echo "collect: ${{ steps.snapshot.outcome }}, data push: ${{ steps.push_data.outcome }}, status push: ${{ steps.push_status.outcome }}"
          exit 1
