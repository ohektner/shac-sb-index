# What this does, in plain language:
# Several times a day (weighted to US game hours) it asks The Odds API for the current
# college basketball point spreads and saves one raw, time-stamped copy. Opening-line
# history cannot be recreated later, so it has to be captured as it happens.
#
# The raw odds go to the PRIVATE data repo (ohektner/shac-sb-index-data), because the
# provider's terms do not allow republishing them. This public repo only gets a status
# row per run (counts, credits left, file hash), never any odds.
name: odds-snapshot

on:
  schedule:
    - cron: "17 13,16,18,20-23 * * *"
    - cron: "17 0-4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out the private data repo
        uses: actions/checkout@v4
        with:
          repository: ohektner/shac-sb-index-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Take odds snapshot
        id: snapshot
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: >
          uv run --no-sync python -m shac.snapshots.odds
          --data-dir data-repo
          --log data/status/odds_snapshot_log.csv

      - name: Commit raw snapshot to the private data repo
        if: always()
        working-directory: data-repo
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds
          if git diff --cached --quiet; then
            echo "Nothing new to commit in the data repo."
            exit 0
          fi
          git commit -m "odds snapshot $STAMP"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          echo "Push to the data repo failed after 3 tries."
          exit 1

      - name: Commit status log to this repo (main)
        if: always()
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/odds_snapshot_log.csv
          if git diff --cached --quiet; then
            echo "Nothing new to commit in the status log."
            exit 0
          fi
          git commit -m "status: odds snapshot $STAMP"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          echo "Push of the status log failed after 3 tries."
          exit 1

      - name: Fail the run if the snapshot step failed
        if: always() && steps.snapshot.outcome == 'failure'
        run: |
          echo "The snapshot step failed; see its log above."
          exit 1
